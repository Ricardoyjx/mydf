name: my-df

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: my-df-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: >
      etcd --advertise-client-urls http://etcd:2379
           --listen-client-urls http://0.0.0.0:2379
           --data-dir /etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - my-df-net

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: my-df-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - my-df-net

  milvus:
    image: milvusdb/milvus:v3.0-beta
    container_name: my-df-milvus
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
    security_opt:
      - seccomp:unconfined
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    command: [ "milvus", "run", "standalone" ]
    depends_on:
      - "etcd"
      - "minio"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    networks:
      - my-df-net

  attu:
    image: zilliz/attu:v3.0.0-beta.5
    container_name: my-df-attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8000:3000"
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - my-df-net

volumes:
  etcd-data:
  minio-data:
  milvus-data:

networks:
  my-df-net:
    name: my-df-net
    driver: bridge
