[project]
name = "my-df"
version = "0.1.0"
description = "基于 LangGraph 的多 Agent 协作网关"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0.0",
    "fastapi>=0.139.0",
    "langchain>=1.3.12",
    "langgraph>=1.2.8",
    "my-df-harness",
    "uvicorn>=0.51.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary]>=3.2.0",
    "pymilvus>=3.0.0",
    "sentence-transformers>=3.0.0",
    "langchain-deepseek>=1.1.0",
]

[tool.uv.workspace]
members = ["packages/harness"]

[tool.uv.sources]
my-df-harness = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0,<2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
