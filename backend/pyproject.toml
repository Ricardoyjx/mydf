[project]
name = "my-df"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0",
    "langchain>=1.3.12",
    "langgraph>=1.2.8",
    "my-df-harness",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "uvicorn>=0.51.0",
]

[tool.uv.workspace]
members = ["packages/harness"]

[tool.uv.sources]
my-df-harness = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
