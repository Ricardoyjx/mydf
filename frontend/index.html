<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>my-df · 对话网关</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── 设计变量 ── */
:root {
  --bg-base: #0c0d10;
  --bg-surface: #14161b;
  --bg-elevated: #1c1f26;
  --bg-hover: #242830;
  --border: #2a2e38;
  --border-focus: #6c5ce7;
  --text-primary: #e4e6ee;
  --text-secondary: #8b8fa3;
  --text-muted: #585c6e;
  --accent: #6c5ce7;
  --accent-glow: rgba(108, 92, 231, 0.25);
  --accent-subtle: rgba(108, 92, 231, 0.08);
  --green: #3dd68c;
  --green-subtle: rgba(61, 214, 140, 0.08);
  --red: #ff6b6b;
  --red-subtle: rgba(255, 107, 107, 0.08);
  --yellow: #ffd93d;
  --amber: #ff9f43;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'IBM Plex Mono', 'SF Mono', 'Fira Code', monospace;
  --shadow-elevated: 0 8px 32px rgba(0,0,0,.45);
  --transition: 180ms cubic-bezier(.4,0,.2,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{
  font-family:var(--font-sans);
  background:var(--bg-base);
  color:var(--text-primary);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}

/* ── 顶部背景装饰 ── */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(108,92,231,.12) 0%, transparent 70%),
    radial-gradient(ellipse 40% 30% at 20% 20%, rgba(61,214,140,.06) 0%, transparent 60%);
  pointer-events:none;
  z-index:0;
}

/* ── 布局 ── */
.app-header{
  position:relative;
  z-index:1;
  padding:1.25rem 2rem .75rem;
  border-bottom:1px solid var(--border);
  background:var(--bg-surface);
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:.75rem;
}
.app-header h1{
  font-size:1.05rem;
  font-weight:600;
  letter-spacing:-.01em;
  display:flex;
  align-items:center;
  gap:.5rem;
}
.app-header h1 .dot{
  display:inline-block;
  width:8px;height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green-subtle);
  animation:pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.45}}

.header-meta{
  display:flex;
  align-items:center;
  gap:1rem;
  font-size:.8rem;
  color:var(--text-secondary);
}
.header-meta .tag{
  padding:2px 10px;
  border-radius:99px;
  background:var(--accent-subtle);
  color:var(--accent);
  font-weight:500;
  font-size:.7rem;
  text-transform:uppercase;
  letter-spacing:.05em;
}

.chat-container{
  position:relative;
  z-index:1;
  flex:1;
  display:flex;
  flex-direction:column;
  max-width:860px;
  width:100%;
  margin:0 auto;
  padding:1.25rem 1.5rem;
}

/* ── 消息列表 ── */
.messages{
  flex:1;
  overflow-y:auto;
  padding:.5rem 0 1rem;
  display:flex;
  flex-direction:column;
  gap:.5rem;
  scroll-behavior:smooth;
}
.messages:empty::after{
  content:'发送一条消息以开始对话';
  display:block;
  text-align:center;
  color:var(--text-muted);
  font-size:.9rem;
  padding:4rem 1rem;
  font-style:italic;
}

.msg{
  display:flex;
  gap:.75rem;
  animation:msg-in .3s ease-out both;
  max-width:88%;
}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.assistant{align-self:flex-start}
.msg.system{align-self:center;max-width:100%;opacity:.7}
.msg.error{align-self:center;max-width:100%}

@keyframes msg-in{
  from{opacity:0;transform:translateY(8px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.msg-avatar{
  width:30px;height:30px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.7rem;
  font-weight:600;
  flex-shrink:0;
  margin-top:2px;
}
.msg.user .msg-avatar{background:var(--accent-subtle);color:var(--accent)}
.msg.assistant .msg-avatar{background:var(--green-subtle);color:var(--green)}
.msg.system .msg-avatar{display:none}
.msg.error .msg-avatar{background:var(--red-subtle);color:var(--red)}

.msg-bubble{
  padding:.7rem 1rem;
  border-radius:var(--radius-md);
  font-size:.9rem;
  line-height:1.65;
  word-break:break-word;
  background:var(--bg-elevated);
  border:1px solid var(--border);
}
.msg.user .msg-bubble{
  background:var(--accent-subtle);
  border-color:rgba(108,92,231,.25);
}
.msg.error .msg-bubble{
  background:var(--red-subtle);
  border-color:rgba(255,107,107,.2);
  color:var(--red);
  font-family:var(--font-mono);
  font-size:.8rem;
}
.msg.system .msg-bubble{
  background:transparent;
  border-color:transparent;
  text-align:center;
  font-size:.75rem;
  color:var(--text-muted);
  padding:.25rem .5rem;
}

.msg-bubble .event-badge{
  display:inline-block;
  font-family:var(--font-mono);
  font-size:.65rem;
  font-weight:500;
  padding:1px 7px;
  border-radius:99px;
  background:var(--bg-hover);
  color:var(--text-muted);
  margin-bottom:4px;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.msg-bubble .event-badge.updates{background:var(--green-subtle);color:var(--green)}
.msg-bubble .event-badge.error{background:var(--red-subtle);color:var(--red)}
.msg-bubble .event-badge.metadata{background:var(--accent-subtle);color:var(--accent)}

/* ── 流式内容 ── */
.stream-content{
  display:inline;
}
.stream-cursor{
  display:inline-block;
  width:2px;height:1.1em;
  background:var(--accent);
  margin-left:2px;
  vertical-align:text-bottom;
  animation:blink-cursor .75s step-end infinite;
}
@keyframes blink-cursor{50%{opacity:0}}

/* ── SSE 事件日志（调试用） ── */
.event-log{
  border-top:1px solid var(--border);
  max-height:140px;
  overflow-y:auto;
  font-family:var(--font-mono);
  font-size:.72rem;
  color:var(--text-muted);
  padding:.5rem 0;
  display:none;
}
.event-log.open{display:block}
.event-log .line{padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event-log .line .evt{color:var(--accent)}
.event-log .line .evt.end{color:var(--green)}
.event-log .line .evt.error{color:var(--red)}
.event-log .line .evt.heartbeat{color:var(--amber)}

/* ── 输入区 ── */
.input-area{
  display:flex;
  gap:.5rem;
  align-items:flex-end;
  padding:.75rem 0 .25rem;
  position:sticky;
  bottom:0;
  background:var(--bg-base);
}
.input-area textarea{
  flex:1;
  background:var(--bg-elevated);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:.7rem .9rem;
  font-family:var(--font-sans);
  font-size:.9rem;
  color:var(--text-primary);
  resize:none;
  min-height:44px;
  max-height:160px;
  line-height:1.5;
  transition:border-color var(--transition);
  outline:none;
}
.input-area textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.input-area textarea::placeholder{color:var(--text-muted)}

.btn{
  height:44px;
  padding:0 1.25rem;
  border:none;
  border-radius:var(--radius-md);
  font-family:var(--font-sans);
  font-size:.85rem;
  font-weight:600;
  cursor:pointer;
  transition:all var(--transition);
  display:flex;
  align-items:center;
  gap:.4rem;
  white-space:nowrap;
}
.btn-primary{
  background:var(--accent);
  color:#fff;
}
.btn-primary:hover{background:#7c6df7;box-shadow:0 4px 16px var(--accent-glow)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}

.btn-ghost{
  background:transparent;
  color:var(--text-secondary);
  padding:0 .7rem;
  font-size:.8rem;
}
.btn-ghost:hover{color:var(--text-primary);background:var(--bg-hover)}

/* ── 底部工具栏 ── */
.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:.35rem 0 .15rem;
  gap:.5rem;
  font-size:.75rem;
  color:var(--text-muted);
}
.toolbar-left{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.toolbar-right{display:flex;align-items:center;gap:.5rem}

.toolbar label{display:flex;align-items:center;gap:.35rem;cursor:pointer}
.toolbar input[type="text"]{
  background:var(--bg-elevated);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:2px 8px;
  font-family:var(--font-mono);
  font-size:.72rem;
  color:var(--text-secondary);
  width:140px;
  outline:none;
  transition:border-color var(--transition);
}
.toolbar input[type="text"]:focus{border-color:var(--accent)}

.toolbar .toggle{
  display:flex;align-items:center;gap:.35rem;
  cursor:pointer;
  user-select:none;
}

/* ── 滚动条 ── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

/* ── 响应式 ── */
@media(max-width:640px){
  .app-header{padding:1rem 1rem .6rem}
  .chat-container{padding:.75rem 1rem}
  .msg{max-width:95%}
  .toolbar{flex-direction:column;align-items:stretch;gap:.4rem}
  .toolbar-left{flex-wrap:wrap}
  .toolbar input[type="text"]{width:100%}
  .header-meta .tag{display:none}
}
</style>
</head>
<body>

<!-- ── 顶栏 ── -->
<header class="app-header">
  <h1><span class="dot"></span> my-df · 对话</h1>
  <div class="header-meta">
    <span class="tag">dev</span>
    <span id="status-badge" style="font-size:.75rem">就绪</span>
  </div>
</header>

<!-- ── 对话区 ── -->
<div class="chat-container">
  <div class="messages" id="messages"></div>

  <!-- ── 输入区 ── -->
  <div class="input-area">
    <textarea id="input" rows="1" placeholder="输入消息… (Enter 发送, Shift+Enter 换行)" autofocus></textarea>
    <button class="btn btn-primary" id="send-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      发送
    </button>
  </div>

  <!-- ── 工具栏 ── -->
  <div class="toolbar">
    <div class="toolbar-left">
      <label>thread <input type="text" id="thread-id" placeholder="auto" spellcheck="false"></label>
      <label>assistant <input type="text" id="assistant-id" value="lead_agent" spellcheck="false"></label>
    </div>
    <div class="toolbar-right">
      <span class="toggle" id="log-toggle">📋 日志</span>
      <span class="toggle" id="load-history">📜 历史</span>
      <button class="btn-ghost" id="clear-btn">清空</button>
    </div>
  </div>
</div>

<!-- ── 事件日志 ── -->
<div class="event-log" id="event-log"></div>

<script>
'use strict';

// =============================================================
// DOM 引用
// =============================================================
const msgEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const threadIdEl = document.getElementById('thread-id');
const assistantIdEl = document.getElementById('assistant-id');
const statusBadge = document.getElementById('status-badge');

// =============================================================
// localStorage 持久化（thread_id，刷新不丢）
// =============================================================
const STORAGE_KEY = 'my-df-thread-id';

function restoreThreadId() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) threadIdEl.value = saved;
}
restoreThreadId();

function saveThreadId(id) {
  localStorage.setItem(STORAGE_KEY, id);
}

// =============================================================
// 加载历史消息
// =============================================================
async function loadHistory() {
  const tid = threadIdEl.value.trim();
  if (!tid) {
    setStatus('请输入 thread_id', 'var(--amber)');
    return;
  }
  setStatus('加载中…', 'var(--accent)');
  try {
    const resp = await fetch('/api/threads/' + encodeURIComponent(tid) + '/messages');
    if (!resp.ok) {
      if (resp.status === 404) {
        setStatus('新对话', 'var(--text-secondary)');
        return;
      }
      setStatus('加载失败', 'var(--red)');
      return;
    }
    const data = await resp.json();
    // 清空现有消息
    msgEl.innerHTML = '';
    // 渲染历史消息
    for (const msg of (data.messages || [])) {
      const role = msg.role === 'human' ? 'user' : msg.role === 'ai' ? 'assistant' : msg.role;
      if (role === 'user' || role === 'assistant') {
        addMessage(role, msg.content, { id: msg.id });
      }
    }
    setStatus(data.messages.length + ' 条消息', 'var(--green)');
    if (data.checkpoint_ts) {
      addMessage('system', '检查点: ' + data.checkpoint_ts.slice(0, 19).replace('T', ' '));
    }
  } catch (err) {
    console.error('loadHistory error:', err);
    setStatus('连接失败', 'var(--red)');
  }
}

let abortController = null;

// =============================================================
// 工具函数
// =============================================================
function genId() {
  return crypto.randomUUID?.() || Math.random().toString(36).slice(2);
}

function scrollBottom() {
  requestAnimationFrame(() => { msgEl.scrollTop = msgEl.scrollHeight; });
}

function setStatus(text, color) {
  statusBadge.textContent = text;
  statusBadge.style.color = color || 'var(--text-secondary)';
}

// =============================================================
// 消息渲染
// =============================================================
function addMessage(role, text, opts = {}) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  if (opts.id) div.dataset.msgId = opts.id;

  // 头像
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'user' ? 'U' : role === 'assistant' ? 'AI' : '•';
  div.appendChild(avatar);

  // 气泡
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  const contentSpan = document.createElement('span');
  contentSpan.className = 'stream-content';
  contentSpan.textContent = text || '';
  bubble.appendChild(contentSpan);

  // 光标（仅 assistant 流式输出时显示）
  if (role === 'assistant' && opts.showCursor) {
    const cursor = document.createElement('span');
    cursor.className = 'stream-cursor';
    bubble.appendChild(cursor);
  }

  div.appendChild(bubble);
  msgEl.appendChild(div);
  scrollBottom();
  return contentSpan;  // 返回内容 span 供后续更新
}

// =============================================================
// SSE 流式请求
// =============================================================
async function sendMessage(userText) {
  if (!userText.trim()) return;
  if (sendBtn.disabled) return;

  // 锁定 UI
  inputEl.disabled = true;
  sendBtn.disabled = true;
  setStatus('发送中…', 'var(--accent)');

  // 显示用户消息
  addMessage('user', userText);

  // 创建 assistant 占位
  const contentSpan = addMessage('assistant', '', { showCursor: true });

  const threadId = threadIdEl.value.trim() || genId();
  if (!threadIdEl.value.trim()) threadIdEl.value = threadId;
  saveThreadId(threadId);

  abortController = new AbortController();

  try {
    const resp = await fetch('/api/runs/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        assistant_id: assistantIdEl.value.trim() || 'lead_agent',
        input: { messages: [{ role: 'user', content: userText }] },
        config: { configurable: { thread_id: threadId } },
      }),
      signal: abortController.signal,
    });

    if (!resp.ok) {
      const text = await resp.text();
      let detail = text;
      try { detail = JSON.parse(text).detail || text; } catch (e) {}
      addMessage('error', `HTTP ${resp.status}: ${detail}`);
      setStatus('请求失败', 'var(--red)');
      return;
    }

    setStatus('接收中…', 'var(--green)');

    // 逐块读取 SSE 流
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let currentEvent = '';
    let currentData = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('event: ')) {
          currentEvent = line.slice(7).trim();
        } else if (line.startsWith('data: ')) {
          currentData = line.slice(6).trim();
        } else if (line === '' && currentEvent) {
          // SSE 帧结束 → 处理
          handleEvent(currentEvent, currentData, contentSpan);
          currentEvent = '';
          currentData = '';
        }
      }
    }

    setStatus('完成', 'var(--green)');
  } catch (err) {
    if (err.name === 'AbortError') {
      setStatus('已取消', 'var(--amber)');
      addMessage('system', '已取消');
    } else {
      console.error('SSE error:', err);
      addMessage('error', err?.message || '连接中断');
      setStatus('连接中断', 'var(--red)');
    }
  } finally {
    // 移除光标
    const cursor = contentSpan.parentElement?.querySelector('.stream-cursor');
    cursor?.remove();
    // 恢复 UI
    inputEl.disabled = false;
    sendBtn.disabled = false;
    abortController = null;
    inputEl.focus();
  }
}

// =============================================================
// SSE 事件处理
// =============================================================
function handleEvent(event, data, contentSpan) {
  switch (event) {
    case '__heartbeat__':
    case '__heartbeat':
      // 心跳，忽略
      break;

    case 'metadata':
      try {
        const meta = JSON.parse(data);
        addMessage('system', `运行: ${(meta.run_id || '').slice(0, 8)}…`);
      } catch (e) {}
      break;

    case 'updates':
      try {
        const parsed = JSON.parse(data);
        // 后端现在只发纯文本字符串
        if (typeof parsed === 'string' && parsed) {
          contentSpan.textContent = parsed;
        }
      } catch (e) {
        // 非 JSON，忽略
      }
      break;

    case 'error':
      try {
        const errData = JSON.parse(data);
        addMessage('error', errData?.message || data);
      } catch (e) {
        addMessage('error', data);
      }
      break;

    case 'end':
      // 流结束，无需操作
      break;

    default:
      // 未知事件，忽略
      break;
  }
}

// =============================================================
// 事件绑定
// =============================================================
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage(inputEl.value);
    inputEl.value = '';
    inputEl.style.height = 'auto';
  }
});

sendBtn.addEventListener('click', () => {
  const text = inputEl.value;
  if (!text.trim()) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendMessage(text);
});

// 自动调整 textarea 高度
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
});

document.getElementById('load-history').addEventListener('click', loadHistory);

document.getElementById('clear-btn').addEventListener('click', () => {
  msgEl.innerHTML = '';
  setStatus('就绪', 'var(--text-secondary)');
});

// Ctrl+Enter 清空
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    msgEl.innerHTML = '';
    threadIdEl.value = '';
    setStatus('就绪', 'var(--text-secondary)');
  }
});

inputEl.focus();
console.log('my-df 对话界面已加载');
</script>
</body>
</html>
