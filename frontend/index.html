<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>my-df · 对话网关</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── 设计变量 ── */
:root {
  --bg-base: #f4f5fa;
  --bg-surface: #ffffff;
  --bg-elevated: #edeef5;
  --bg-hover: #e3e5ef;
  --border: #dde0ea;
  --border-focus: #6c5ce7;
  --text-primary: #1e2330;
  --text-secondary: #5b6273;
  --text-muted: #9aa1b3;
  --accent: #6c5ce7;
  --accent-glow: rgba(108, 92, 231, 0.16);
  --accent-subtle: rgba(108, 92, 231, 0.08);
  --green: #0d9f6e;
  --green-subtle: rgba(13, 159, 110, 0.1);
  --red: #e5484d;
  --red-subtle: rgba(229, 72, 77, 0.1);
  --yellow: #b45309;
  --amber: #c47f0a;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'IBM Plex Mono', 'SF Mono', 'Fira Code', monospace;
  --shadow-elevated: 0 8px 32px rgba(30,35,48,.12);
  --transition: 180ms cubic-bezier(.4,0,.2,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{
  font-family:var(--font-sans);
  background:var(--bg-base);
  color:var(--text-primary);
  min-height:100vh;
  display:flex;
  flex-direction:row;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}

/* ── 顶部背景装饰 ── */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(108,92,231,.12) 0%, transparent 70%),
    radial-gradient(ellipse 40% 30% at 20% 20%, rgba(61,214,140,.06) 0%, transparent 60%);
  pointer-events:none;
  z-index:0;
}

/* ── 侧边栏 ── */
.sidebar{
  position:relative;
  z-index:2;
  width:218px;
  flex-shrink:0;
  background:var(--bg-surface);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:1.1rem .8rem;
}
.sidebar-logo{
  font-size:1.02rem;
  font-weight:600;
  letter-spacing:-.01em;
  display:flex;
  align-items:center;
  gap:.5rem;
  padding:.35rem .55rem 1.15rem;
}
.sidebar-logo .dot{
  display:inline-block;
  width:8px;height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green-subtle);
  animation:pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.45}}

.side-nav{
  display:flex;
  flex-direction:column;
  gap:.35rem;
  flex:1;
}
.side-item{
  display:flex;
  align-items:center;
  gap:.6rem;
  background:transparent;
  border:1px solid transparent;
  color:var(--text-secondary);
  padding:.55rem .7rem;
  border-radius:var(--radius-md);
  cursor:pointer;
  font-size:.9rem;
  text-align:left;
  text-decoration:none;
  transition:var(--transition);
  user-select:none;
}
.side-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.side-item.active{background:var(--accent-subtle);border-color:var(--accent);color:var(--text-primary)}
.sidebar-foot{
  display:flex;
  align-items:center;
  gap:.6rem;
  padding:.7rem .55rem 0;
  font-size:.75rem;
  color:var(--text-secondary);
  border-top:1px solid var(--border);
  margin-top:.6rem;
}
.sidebar-foot .tag{
  padding:2px 10px;
  border-radius:99px;
  background:var(--accent-subtle);
  color:var(--accent);
  font-weight:500;
  font-size:.68rem;
  text-transform:uppercase;
  letter-spacing:.05em;
}

.content{
  position:relative;
  z-index:1;
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

/* ── 页面（hash 路由，独立成页） ── */
.page{display:none;flex:1;flex-direction:column;min-height:0}
.page.active{display:flex}

.chat-container{
  position:relative;
  z-index:1;
  flex:1;
  display:flex;
  flex-direction:column;
  max-width:860px;
  width:100%;
  margin:0 auto;
  padding:1.25rem 1.5rem;
}

/* ── 消息列表 ── */
.messages{
  flex:1;
  overflow-y:auto;
  padding:.5rem 0 1rem;
  display:flex;
  flex-direction:column;
  gap:.5rem;
  scroll-behavior:smooth;
}
.messages:empty::after{
  content:'发送一条消息以开始对话';
  display:block;
  text-align:center;
  color:var(--text-muted);
  font-size:.9rem;
  padding:4rem 1rem;
  font-style:italic;
}

.msg{
  display:flex;
  gap:.75rem;
  animation:msg-in .3s ease-out both;
  max-width:88%;
}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.assistant{align-self:flex-start}
.msg.system{align-self:center;max-width:100%;opacity:.7}
.msg.error{align-self:center;max-width:100%}

@keyframes msg-in{
  from{opacity:0;transform:translateY(8px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.msg-avatar{
  width:30px;height:30px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.7rem;
  font-weight:600;
  flex-shrink:0;
  margin-top:2px;
}
.msg.user .msg-avatar{background:var(--accent-subtle);color:var(--accent)}
.msg.assistant .msg-avatar{background:var(--green-subtle);color:var(--green)}
.msg.system .msg-avatar{display:none}
.msg.error .msg-avatar{background:var(--red-subtle);color:var(--red)}

.msg-bubble{
  padding:.7rem 1rem;
  border-radius:var(--radius-md);
  font-size:.9rem;
  line-height:1.65;
  word-break:break-word;
  background:var(--bg-elevated);
  border:1px solid var(--border);
}
.msg.user .msg-bubble{
  background:var(--accent-subtle);
  border-color:rgba(108,92,231,.25);
}
.msg.error .msg-bubble{
  background:var(--red-subtle);
  border-color:rgba(255,107,107,.2);
  color:var(--red);
  font-family:var(--font-mono);
  font-size:.8rem;
}
.msg.system .msg-bubble{
  background:transparent;
  border-color:transparent;
  text-align:center;
  font-size:.75rem;
  color:var(--text-muted);
  padding:.25rem .5rem;
}

.msg-bubble .event-badge{
  display:inline-block;
  font-family:var(--font-mono);
  font-size:.65rem;
  font-weight:500;
  padding:1px 7px;
  border-radius:99px;
  background:var(--bg-hover);
  color:var(--text-muted);
  margin-bottom:4px;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.msg-bubble .event-badge.updates{background:var(--green-subtle);color:var(--green)}
.msg-bubble .event-badge.error{background:var(--red-subtle);color:var(--red)}
.msg-bubble .event-badge.metadata{background:var(--accent-subtle);color:var(--accent)}

/* ── 流式内容 ── */
.stream-content{
  display:inline;
}
.stream-cursor{
  display:inline-block;
  width:2px;height:1.1em;
  background:var(--accent);
  margin-left:2px;
  vertical-align:text-bottom;
  animation:blink-cursor .75s step-end infinite;
}
.msg-bubble .md-code{
  background:var(--bg-base);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:.6rem .8rem;
  overflow-x:auto;
  font-family:var(--font-mono);
  font-size:.82rem;
  margin:.4rem 0;
  white-space:pre-wrap;
}
.msg-bubble code.md-inline{
  background:var(--bg-base);
  border:1px solid var(--border);
  border-radius:4px;
  padding:0 .3em;
  font-family:var(--font-mono);
  font-size:.85em;
}
.msg-bubble strong{font-weight:650}
.msg-bubble .md-h{margin:.5rem 0 .2rem}
.msg-bubble .md-li{margin-left:1.2rem}
.msg-bubble a{color:var(--accent)}
@keyframes blink-cursor{50%{opacity:0}}

/* ── SSE 事件日志（调试用） ── */
.event-log{
  border-top:1px solid var(--border);
  max-height:140px;
  overflow-y:auto;
  font-family:var(--font-mono);
  font-size:.72rem;
  color:var(--text-muted);
  padding:.5rem 0;
  display:none;
}
.event-log.open{display:block}
.event-log .line{padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event-log .line .evt{color:var(--accent)}
.event-log .line .evt.end{color:var(--green)}
.event-log .line .evt.error{color:var(--red)}
.event-log .line .evt.heartbeat{color:var(--amber)}

/* ── 输入区 ── */
.input-area{
  display:flex;
  gap:.5rem;
  align-items:flex-end;
  padding:.75rem 0 .25rem;
  position:sticky;
  bottom:0;
  background:var(--bg-base);
}
.input-area textarea{
  flex:1;
  background:var(--bg-elevated);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:.7rem .9rem;
  font-family:var(--font-sans);
  font-size:.9rem;
  color:var(--text-primary);
  resize:none;
  min-height:44px;
  max-height:160px;
  line-height:1.5;
  transition:border-color var(--transition);
  outline:none;
}
.input-area textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.input-area textarea::placeholder{color:var(--text-muted)}

.btn{
  height:44px;
  padding:0 1.25rem;
  border:none;
  border-radius:var(--radius-md);
  font-family:var(--font-sans);
  font-size:.85rem;
  font-weight:600;
  cursor:pointer;
  transition:all var(--transition);
  display:flex;
  align-items:center;
  gap:.4rem;
  white-space:nowrap;
}
.btn-primary{
  background:var(--accent);
  color:#fff;
}
.btn-primary:hover{background:#7c6df7;box-shadow:0 4px 16px var(--accent-glow)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}

.btn-ghost{
  background:transparent;
  color:var(--text-secondary);
  padding:0 .7rem;
  font-size:.8rem;
}
.btn-ghost:hover{color:var(--text-primary);background:var(--bg-hover)}

/* ── 底部工具栏 ── */
.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:.35rem 0 .15rem;
  gap:.5rem;
  font-size:.75rem;
  color:var(--text-muted);
}
.toolbar-left{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.toolbar-right{display:flex;align-items:center;gap:.5rem}

.toolbar label{display:flex;align-items:center;gap:.35rem;cursor:pointer}
.toolbar input[type="text"]{
  background:var(--bg-elevated);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:2px 8px;
  font-family:var(--font-mono);
  font-size:.72rem;
  color:var(--text-secondary);
  width:140px;
  outline:none;
  transition:border-color var(--transition);
}
.toolbar input[type="text"]:focus{border-color:var(--accent)}

.toolbar .toggle{
  display:flex;align-items:center;gap:.35rem;
  cursor:pointer;
  user-select:none;
}

/* ── 滚动条 ── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

/* ── 面板 ── */
.panel{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;gap:1rem;max-width:860px;width:100%;margin:0 auto;padding:1.25rem 1.5rem}
.panel-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:1rem 1.1rem}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
.panel-card h3{font-size:.9rem;font-weight:600;color:var(--text-primary);margin:0 0 .75rem}

/* ── 表单与输入 ── */
.rag-form{display:flex;flex-direction:column;gap:.6rem}
.rag-form input[type="text"],.rag-form textarea,.rag-search input[type="text"]{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);padding:.55rem .7rem;font-family:var(--font-sans);font-size:.88rem;width:100%}
.rag-form textarea{min-height:90px;resize:vertical}
.rag-form input:focus,.rag-form textarea:focus,.rag-search input:focus{outline:none;border-color:var(--border-focus)}
.rag-row{display:flex;gap:.6rem;align-items:center}
.file-btn{display:inline-flex;align-items:center;gap:.35rem;cursor:pointer}
#rag-file-name{font-size:.78rem;color:var(--text-muted)}
.rag-search button{margin-top:.55rem}

/* ── 文档列表 ── */
.doc-item{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.6rem .2rem;border-bottom:1px solid var(--border)}
.doc-item:last-child{border-bottom:none}
.doc-info{min-width:0}
.doc-title{font-size:.88rem;font-weight:500;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-meta{font-size:.75rem;color:var(--text-muted);margin-top:.15rem}
.doc-del{flex-shrink:0}

/* ── 检索结果 ── */
.search-result{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.7rem .85rem;margin-top:.6rem}
.search-result .sr-head{display:flex;justify-content:space-between;gap:1rem;font-size:.78rem;color:var(--text-secondary);margin-bottom:.3rem}
.search-result .sr-score{color:var(--green);flex-shrink:0}
.search-result .sr-text{font-size:.85rem;color:var(--text-primary);line-height:1.5;word-break:break-word}

/* ── 记忆面板 ── */
.memory-section{margin-bottom:1rem}
.memory-section h4{font-size:.78rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.45rem}
.memory-item{font-size:.85rem;color:var(--text-primary);padding:.45rem .6rem;background:var(--bg-elevated);border-radius:var(--radius-sm);margin-bottom:.4rem;line-height:1.55;word-break:break-word}
.memory-item .mem-label{color:var(--text-muted);font-size:.75rem}
.memory-empty{color:var(--text-muted);font-size:.85rem;padding:.2rem 0}

/* ═══════════════════════════════════════════════════════════
   视觉美化增强
   ═══════════════════════════════════════════════════════════ */
:root{
  --accent-2:#8b5cf6;
  --grad-accent:linear-gradient(135deg,#6c5ce7 0%,#8b5cf6 100%);
  --shadow-card:0 10px 30px rgba(30,35,48,.08);
  --shadow-pop:0 14px 40px rgba(108,92,231,.14);
  --bg-soft:rgba(30,35,48,.025);
}

/* 背景氛围：更丰富的光晕 + 细网格 */
body::before{
  background:
    radial-gradient(ellipse 70% 45% at 15% -5%, rgba(108,92,231,.10) 0%, transparent 65%),
    radial-gradient(ellipse 45% 35% at 90% 5%, rgba(13,159,110,.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 50% 110%, rgba(139,92,246,.06) 0%, transparent 60%);
}
body::after{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(30,35,48,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(30,35,48,.03) 1px, transparent 1px);
  background-size:44px 44px;
  pointer-events:none;
  z-index:0;
}

/* 侧边栏 */
.sidebar{
  background:linear-gradient(180deg, rgba(30,35,48,.02), transparent 45%), var(--bg-surface);
  box-shadow:inset -1px 0 0 rgba(30,35,48,.04);
}
.sidebar-logo{
  font-size:1.08rem;
  letter-spacing:.02em;
  background:var(--grad-accent);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.sidebar-logo .dot{
  background:var(--green);
  box-shadow:0 0 10px rgba(61,214,140,.55);
}
.side-item{
  position:relative;
  font-weight:500;
  padding:.58rem .75rem;
  border-radius:10px;
  transition:all .2s ease;
}
.side-item::before{
  content:'';
  position:absolute;left:-.8rem;top:50%;
  width:3px;height:0;
  transform:translateY(-50%);
  border-radius:99px;
  background:var(--grad-accent);
  transition:height .2s ease;
}
.side-item:hover{
  background:var(--bg-hover);
  color:var(--text-primary);
  transform:translateX(2px);
}
.side-item.active{
  background:linear-gradient(135deg, rgba(108,92,231,.16), rgba(139,92,246,.07));
  border-color:rgba(108,92,231,.4);
  color:#4338ca;
  box-shadow:0 4px 16px rgba(108,92,231,.1);
}
.side-item.active::before{height:58%}
.sidebar-foot{
  background:var(--bg-soft);
  border:1px solid rgba(30,35,48,.05);
  border-radius:10px;
  padding:.65rem .7rem;
}

/* 按钮 */
.btn-primary{
  background:var(--grad-accent);
  box-shadow:0 6px 18px rgba(108,92,231,.28);
}
.btn-primary:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 24px rgba(108,92,231,.36);
  filter:brightness(1.06);
}
.btn-primary:active{
  transform:translateY(0);
  box-shadow:0 4px 12px rgba(108,92,231,.22);
}
.btn-ghost{
  border:1px solid transparent;
  border-radius:var(--radius-sm);
  padding:.38rem .7rem;
  transition:all var(--transition);
}
.btn-ghost:hover{
  color:var(--text-primary);
  background:var(--bg-hover);
  border-color:var(--border);
}

/* 消息气泡 */
.msg-bubble{
  box-shadow:0 2px 10px rgba(30,35,48,.06);
  border-color:rgba(30,35,48,.07);
}
.msg.user .msg-bubble{
  background:var(--grad-accent);
  color:#fff;
  border:none;
  border-top-right-radius:4px;
  box-shadow:0 6px 18px rgba(108,92,231,.25);
}
.msg.assistant .msg-bubble{
  background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.15)), var(--bg-elevated);
  border-top-left-radius:4px;
}
.msg-avatar{
  border:1px solid rgba(30,35,48,.08);
  box-shadow:0 2px 8px rgba(30,35,48,.1);
}

/* 输入区 */
.input-area{
  background:linear-gradient(180deg, transparent, var(--bg-base) 32%);
  padding:.9rem 0 .3rem;
}
.input-area textarea{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
}
.input-area textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-glow), 0 4px 18px rgba(108,92,231,.12);
}

/* 工具栏输入 */
.toolbar input[type="text"]{
  background:var(--bg-elevated);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  color:var(--text-secondary);
  padding:3px 9px;
  font-family:var(--font-mono);
  font-size:.72rem;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
}
.toolbar input[type="text"]:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent-glow);
  color:var(--text-primary);
}
.toolbar .toggle{transition:color var(--transition)}
.toolbar .toggle:hover{color:var(--text-primary)}

/* ── 工具栏与标题：放大、块状化 ── */
.toolbar{
  font-size:.85rem;
  gap:.6rem;
}
.toolbar input[type="text"]{
  font-size:.8rem;
  width:150px;
  padding:5px 10px;
}
.toolbar .toggle{
  background:var(--bg-elevated);
  border:1px solid var(--border);
  border-radius:8px;
  padding:.42rem .85rem;
  font-size:.83rem;
  font-weight:500;
  color:var(--text-secondary);
  transition:all var(--transition);
}
.toolbar .toggle:hover{
  color:var(--accent);
  border-color:var(--border-focus);
  background:var(--accent-subtle);
}
.toolbar .btn-ghost{
  font-size:.83rem;
  font-weight:500;
  color:var(--red);
  border:1px solid var(--border);
  background:var(--bg-elevated);
}
.toolbar .btn-ghost:hover{
  background:var(--red-subtle);
  border-color:rgba(229,72,77,.3);
  color:var(--red);
}
.btn-ghost{
  font-size:.85rem;
  padding:.42rem .8rem;
}

/* ── 面板标题 ── */
.panel-card h3{
  font-size:1rem;
  font-weight:700;
  color:var(--text-primary);
  display:flex;
  align-items:center;
  gap:.45rem;
}
.panel-card h3::before{
  content:'';
  width:3px;height:1.05em;
  border-radius:99px;

<script>
'use strict';

// =============================================================
// DOM 引用
// =============================================================
const msgEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const threadIdEl = document.getElementById('thread-id');
const assistantIdEl = document.getElementById('assistant-id');
const statusBadge = document.getElementById('status-badge');

// =============================================================
// localStorage 持久化（thread_id，刷新不丢）
// =============================================================
const STORAGE_KEY = 'my-df-thread-id';

function restoreThreadId() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) threadIdEl.value = saved;
}
restoreThreadId();

function saveThreadId(id) {
  localStorage.setItem(STORAGE_KEY, id);
}

// =============================================================
// 加载历史消息
// =============================================================
async function loadHistory() {
  const tid = threadIdEl.value.trim();
  if (!tid) {
    setStatus('请输入 thread_id', 'var(--amber)');
    return;
  }
  setStatus('加载中…', 'var(--accent)');
  try {
    const resp = await fetch('/api/threads/' + encodeURIComponent(tid) + '/messages');
    if (!resp.ok) {
      if (resp.status === 404) {
        setStatus('新对话', 'var(--text-secondary)');
        return;
      }
      setStatus('加载失败', 'var(--red)');
      return;
    }
    const data = await resp.json();
    // 清空现有消息
    msgEl.innerHTML = '';
    // 渲染历史消息
    for (const msg of (data.messages || [])) {
      const role = msg.role === 'human' ? 'user' : msg.role === 'ai' ? 'assistant' : msg.role;
      if (role === 'user' || role === 'assistant') {
        addMessage(role, msg.content, { id: msg.id, markdown: role === 'assistant' });
      }
    }
    setStatus(data.messages.length + ' 条消息', 'var(--green)');
    if (data.checkpoint_ts) {
      addMessage('system', '检查点: ' + data.checkpoint_ts.slice(0, 19).replace('T', ' '));
    }
  } catch (err) {
    console.error('loadHistory error:', err);
    setStatus('连接失败', 'var(--red)');
  }
}

let abortController = null;

// =============================================================
// 工具函数
// =============================================================
function genId() {
  return crypto.randomUUID?.() || Math.random().toString(36).slice(2);
}

function scrollBottom() {
  requestAnimationFrame(() => { msgEl.scrollTop = msgEl.scrollHeight; });
}

function setStatus(text, color) {
  statusBadge.textContent = text;
  statusBadge.style.color = color || 'var(--text-secondary)';
}

// =============================================================
// 消息渲染
// =============================================================
function addMessage(role, text, opts = {}) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  if (opts.id) div.dataset.msgId = opts.id;

  // 头像
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'user' ? 'U' : role === 'assistant' ? 'AI' : '•';
  div.appendChild(avatar);

  // 气泡
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  const contentSpan = document.createElement('span');
  contentSpan.className = 'stream-content';
  if (opts.markdown) {
    contentSpan.dataset.markdown = '1';
    contentSpan.innerHTML = renderMarkdown(text || '');
  } else {
    contentSpan.textContent = text || '';
  }
  bubble.appendChild(contentSpan);

  // 光标（仅 assistant 流式输出时显示）
  if (role === 'assistant' && opts.showCursor) {
    const cursor = document.createElement('span');
    cursor.className = 'stream-cursor';
    bubble.appendChild(cursor);
  }

  div.appendChild(bubble);
  msgEl.appendChild(div);
  scrollBottom();
  return contentSpan;  // 返回内容 span 供后续更新
}

// =============================================================
// SSE 流式请求
// =============================================================
async function sendMessage(userText) {
  if (!userText.trim()) return;
  if (sendBtn.disabled) return;

  // 锁定 UI
  inputEl.disabled = true;
  sendBtn.disabled = true;
  setStatus('发送中…', 'var(--accent)');

  // 显示用户消息
  addMessage('user', userText);

  // 创建 assistant 占位
  const contentSpan = addMessage('assistant', '', { showCursor: true, markdown: true });

  const threadId = threadIdEl.value.trim() || genId();
  if (!threadIdEl.value.trim()) threadIdEl.value = threadId;
  saveThreadId(threadId);

  abortController = new AbortController();

  try {
    const resp = await fetch('/api/runs/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        assistant_id: assistantIdEl.value.trim() || 'lead_agent',
        input: { messages: [{ role: 'user', content: userText }] },
        config: { configurable: { thread_id: threadId } },
      }),
      signal: abortController.signal,
    });

    if (!resp.ok) {
      const text = await resp.text();
      let detail = text;
      try { detail = JSON.parse(text).detail || text; } catch (e) {}
      addMessage('error', `HTTP ${resp.status}: ${detail}`);
      setStatus('请求失败', 'var(--red)');
      return;
    }

    setStatus('接收中…', 'var(--green)');

    // 逐块读取 SSE 流
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let currentEvent = '';
    let currentData = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('event: ')) {
          currentEvent = line.slice(7).trim();
        } else if (line.startsWith('data: ')) {
          currentData = line.slice(6).trim();
        } else if (line === '' && currentEvent) {
          // SSE 帧结束 → 处理
          handleEvent(currentEvent, currentData, contentSpan);
          currentEvent = '';
          currentData = '';
        }
      }
    }

    setStatus('完成', 'var(--green)');
  } catch (err) {
    if (err.name === 'AbortError') {
      setStatus('已取消', 'var(--amber)');
      addMessage('system', '已取消');
    } else {
      console.error('SSE error:', err);
      addMessage('error', err?.message || '连接中断');
      setStatus('连接中断', 'var(--red)');
    }
  } finally {
    // 移除光标
    const cursor = contentSpan.parentElement?.querySelector('.stream-cursor');
    cursor?.remove();
    // 流式结束：把 Markdown 渲染成富文本
    if (contentSpan.dataset.markdown) {
      contentSpan.innerHTML = renderMarkdown(contentSpan.textContent);
    }
    // 恢复 UI
    inputEl.disabled = false;
    sendBtn.disabled = false;
    abortController = null;
    inputEl.focus();
  }
}

// =============================================================
// SSE 事件处理
// =============================================================
function handleEvent(event, data, contentSpan) {
  switch (event) {
    case '__heartbeat__':
    case '__heartbeat':
      // 心跳，忽略
      break;

    case 'metadata':
      try {
        const meta = JSON.parse(data);
        addMessage('system', `运行: ${(meta.run_id || '').slice(0, 8)}…`);
      } catch (e) {}
      break;

    case 'updates':
      try {
        const parsed = JSON.parse(data);
        // 后端现在只发纯文本字符串
        if (typeof parsed === 'string' && parsed) {
          contentSpan.textContent = parsed;
        }
      } catch (e) {
        // 非 JSON，忽略
      }
      break;

    case 'error':
      try {
        const errData = JSON.parse(data);
        addMessage('error', errData?.message || data);
      } catch (e) {
        addMessage('error', data);
      }
      break;

    case 'end':
      // 流结束，无需操作
      break;

    default:
      // 未知事件，忽略
      break;
  }
}

// =============================================================
// 事件绑定
// =============================================================
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage(inputEl.value);
    inputEl.value = '';
    inputEl.style.height = 'auto';
  }
});

sendBtn.addEventListener('click', () => {
  const text = inputEl.value;
  if (!text.trim()) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendMessage(text);
});

// 自动调整 textarea 高度
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
});

document.getElementById('load-history').addEventListener('click', loadHistory);

document.getElementById('clear-btn').addEventListener('click', () => {
  msgEl.innerHTML = '';
  setStatus('就绪', 'var(--text-secondary)');
});

// Ctrl+Enter 清空
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    msgEl.innerHTML = '';
    threadIdEl.value = '';
    setStatus('就绪', 'var(--text-secondary)');
  }
});

// =============================================================
// Tab 切换（对话 / 知识库 / 记忆）
// =============================================================
let ragLoaded = false;
let memoryLoaded = false;
let obsLoaded = false;

// hash 路由：#/chat、#/rag、#/memory（每个功能独立成页，可刷新/分享/前进后退）
function navigate() {
  const raw = (location.hash || '').replace(/^#\/?/, '');
  const name = ['chat', 'rag', 'memory', 'observability'].includes(raw) ? raw : 'chat';
  document.querySelectorAll('.page').forEach((p) => {
    p.classList.toggle('active', p.id === name + '-page');
  });
  document.querySelectorAll('.side-item').forEach((x) => {
    x.classList.toggle('active', x.dataset.tab === name);
  });
  if (name === 'rag' && !ragLoaded) loadDocuments();
  if (name === 'memory' && !memoryLoaded) loadMemory();
  if (name === 'observability' && !obsLoaded) loadRuns();
}
window.addEventListener('hashchange', navigate);
navigate();

// =============================================================
// 通用 fetch 封装 + HTML 转义
// =============================================================
async function apiFetch(url, options) {
  const resp = await fetch(url, options);
  if (!resp.ok) {
    let detail = '';
    try { detail = (await resp.json()).detail || ''; } catch (e) { /* 非 JSON */ }
    throw new Error(`${resp.status}${detail ? ' ' + detail : ''}`.trim());
  }
  return resp.json();
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = String(s ?? '');
  return d.innerHTML;
}

// 轻量 Markdown 渲染：先转义再替换标记，仅支持常用语法，防 XSS
function renderMarkdown(text) {
  if (!text) return '';
  const blocks = [];
  let html = esc(text);
  // 代码块 / 行内代码先占位，避免内部标记被后续规则误伤
  html = html.replace(/```([\s\S]*?)```/g, (_, code) => {
    blocks.push('<pre class="md-code"><code>' + code.replace(/^\n+|\n+$/g, '') + '</code></pre>');
    return '\u0001' + (blocks.length - 1) + '\u0001';
  });
  html = html.replace(/`([^`\n]+)`/g, (_, code) => {
    blocks.push('<code class="md-inline">' + code + '</code>');
    return '\u0001' + (blocks.length - 1) + '\u0001';
  });
  // 链接 / 加粗 / 斜体
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  // 标题 / 列表
  html = html.replace(/^### (.+)$/gm, '<h4 class="md-h">$1</h4>');
  html = html.replace(/^## (.+)$/gm, '<h3 class="md-h">$1</h3>');
  html = html.replace(/^# (.+)$/gm, '<h2 class="md-h">$1</h2>');
  html = html.replace(/^\s*[-*] (.+)$/gm, '<li class="md-li">$1</li>');
  html = html.replace(/^\s*\d+\. (.+)$/gm, '<li class="md-li">$1</li>');
  // 段落与换行
  html = html.replace(/\n{2,}/g, '</p><p>').replace(/\n/g, '<br>');
  // 还原代码占位
  html = html.replace(/\u0001(\d+)\u0001/g, (_, i) => blocks[+i] || '');
  return '<p>' + html + '</p>';
}

// =============================================================
// 知识库（RAG）
// =============================================================
const ragDocList = document.getElementById('rag-doc-list');
const ragResultsEl = document.getElementById('rag-search-results');
const ragFileInput = document.getElementById('rag-file');

async function loadDocuments() {
  ragDocList.innerHTML = '<div class="memory-empty">加载中…</div>';
  try {
    const data = await apiFetch('/api/rag/documents?user_id=default&limit=200');
    const docs = data.documents || [];
    ragLoaded = true;
    if (!docs.length) {
      ragDocList.innerHTML = '<div class="memory-empty">知识库为空，先入库一些文档吧</div>';
      return;
    }
    ragDocList.innerHTML = docs.map((d) => `
      <div class="doc-item">
        <div class="doc-info">
          <div class="doc-title">${esc(d.title)}</div>
          <div class="doc-meta">${esc(d.source || '')} · ${d.chunk_count ?? 0} 块 · ${esc(String(d.updated_at || '').slice(0, 19).replace('T', ' '))}</div>
        </div>
        <button class="btn-ghost doc-del" data-del="${esc(d.document_id)}">删除</button>
      </div>`).join('');
  } catch (err) {
    ragDocList.innerHTML = `<div class="memory-empty">加载失败：${esc(err.message)}</div>`;
  }
}

async function addDocument() {
  const title = document.getElementById('rag-title').value.trim();
  const content = document.getElementById('rag-content').value.trim();
  if (!content) {
    setStatus('请输入文档内容', 'var(--amber)');
    return;
  }
  const btn = document.getElementById('rag-add-btn');
  btn.disabled = true;
  try {
    const data = await apiFetch('/api/rag/documents', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: title || '未命名文档', content, user_id: 'default' }),
    });
    setStatus(`入库成功：${data.chunk_count} 块`, 'var(--green)');
    document.getElementById('rag-title').value = '';
    document.getElementById('rag-content').value = '';
    await loadDocuments();
  } catch (err) {
    setStatus('入库失败：' + err.message, 'var(--red)');
  } finally {
    btn.disabled = false;
  }
}

async function uploadDocument(file) {
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    const bytes = new Uint8Array(buf);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    const contentBase64 = btoa(bin);
    const data = await apiFetch('/api/rag/files', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: file.name, content_base64: contentBase64, user_id: 'default' }),
    });
    setStatus(`上传入库成功：${data.chunk_count} 块`, 'var(--green)');
    document.getElementById('rag-file-name').textContent = '';
    await loadDocuments();
  } catch (err) {
    setStatus('上传失败：' + err.message, 'var(--red)');
  }
}

async function deleteDocument(id) {
  if (!confirm('确认删除该文档？')) return;
  try {
    await apiFetch(`/api/rag/documents/${encodeURIComponent(id)}?user_id=default`, {
      method: 'DELETE',
    });
    setStatus('已删除', 'var(--green)');
    await loadDocuments();
  } catch (err) {
    setStatus('删除失败：' + err.message, 'var(--red)');
  }
}

async function searchDocs() {
  const q = document.getElementById('rag-query').value.trim();
  if (!q) {
    setStatus('请输入检索问题', 'var(--amber)');
    return;
  }
  ragResultsEl.innerHTML = '<div class="memory-empty">检索中…</div>';
  try {
    const data = await apiFetch(`/api/rag/search?q=${encodeURIComponent(q)}&user_id=default&top_k=5`);
    const results = data.results || [];
    if (!results.length) {
      ragResultsEl.innerHTML = '<div class="memory-empty">未命中知识库</div>';
      return;
    }
    ragResultsEl.innerHTML = results.map((r) => `
      <div class="search-result">
        <div class="sr-head">
          <span>${esc((r.metadata && r.metadata.title) || '未命名文档')}</span>
          <span class="sr-score">score ${Number(r.score).toFixed(4)}</span>
        </div>
        <div class="sr-text">${esc(r.text)}</div>
      </div>`).join('');
  } catch (err) {
    ragResultsEl.innerHTML = `<div class="memory-empty">检索失败：${esc(err.message)}</div>`;
  }
}

// =============================================================
// 记忆面板
// =============================================================
const memoryContent = document.getElementById('memory-content');

async function loadMemory() {
  memoryContent.innerHTML = '<div class="memory-empty">加载中…</div>';
  const tid = threadIdEl.value.trim() || 'default';
  try {
    const data = await apiFetch(`/api/${encodeURIComponent(tid)}/memory`);
    memoryLoaded = true;
    const user = data.user || {};
    const hist = data.history || {};
    const userSec = [
      ['工作背景', user.workContext && user.workContext.summary],
      ['个人背景', user.personalContext && user.personalContext.summary],
      ['当前关注', user.topOfMind && user.topOfMind.summary],
    ].filter((x) => x[1]);
    const histSec = [
      ['近期对话', hist.recentMonths && hist.recentMonths.summary],
      ['早期背景', hist.earlierContext && hist.earlierContext.summary],
      ['长期背景', hist.longTermBackground && hist.longTermBackground.summary],
    ].filter((x) => x[1]);
    const parts = [];
    if (userSec.length) {
      parts.push('<div class="memory-section"><h4>用户上下文</h4>' +
        userSec.map(([label, s]) => `<div class="memory-item"><span class="mem-label">${label}：</span>${renderMarkdown(s)}</div>`).join('') +
        '</div>');
    }
    if (histSec.length) {
      parts.push('<div class="memory-section"><h4>历史上下文</h4>' +
        histSec.map(([label, s]) => `<div class="memory-item"><span class="mem-label">${label}：</span>${renderMarkdown(s)}</div>`).join('') +
        '</div>');
    }
    if ((data.facts || []).length) {
      parts.push('<div class="memory-section"><h4>已提取事实</h4>' +
        data.facts.map((f) => `<div class="memory-item">${renderMarkdown(f.content)}</div>`).join('') +
        '</div>');
    }
    if (!parts.length) {
      memoryContent.innerHTML = '<div class="memory-empty">暂无记忆内容（对话后会自动积累）</div>';
    } else {
      memoryContent.innerHTML = parts.join('') +
        `<div class="memory-empty" style="margin-top:.6rem">最后更新：${esc(data.lastUpdated || '-')}</div>`;
    }
  } catch (err) {
    memoryContent.innerHTML = `<div class="memory-empty">加载失败：${esc(err.message)}</div>`;
  }
}

// ── 知识库/记忆事件绑定 ──
document.getElementById('rag-add-btn').addEventListener('click', addDocument);
document.getElementById('rag-search-btn').addEventListener('click', searchDocs);
document.getElementById('rag-refresh').addEventListener('click', loadDocuments);
document.getElementById('memory-refresh').addEventListener('click', loadMemory);
ragFileInput.addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) {
    document.getElementById('rag-file-name').textContent = f.name;
    uploadDocument(f);
  }
});
ragDocList.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-del]');
  if (btn) deleteDocument(btn.dataset.del);
});

// =============================================================
// 观测页：运行列表 + 事件时间线
// =============================================================
const OBS_EVENT_META = {
  run_start: ['🚀', '启动'],
  run_end: ['🏁', '结束'],
  token: ['⚡', 'Token'],
  route: ['🔀', '路由'],
  subagent_start: ['🤖', '子代理开始'],
  subagent_end: ['✅', '子代理结束'],
  reflect: ['🔍', '评审'],
};

async function loadRuns() {
  const listEl = document.getElementById('obs-run-list');
  listEl.innerHTML = '<div class="memory-empty">加载中…</div>';
  try {
    const data = await apiFetch('/api/runs?limit=50');
    const runs = data.runs || [];
    obsLoaded = true;
    if (!runs.length) {
      listEl.innerHTML = '<div class="memory-empty">暂无运行记录</div>';
      return;
    }
    listEl.innerHTML = runs.map((r) => {
      const status = esc(r.status || 'unknown');
      const created = String(r.created_at || '').replace('T', ' ').slice(0, 19);
      return `<div class="obs-run-item" data-run-id="${esc(r.run_id)}">
        <span class="obs-run-id">${esc(String(r.run_id || '').slice(0, 8))}</span>
        <span class="obs-status run-${status}">${status}</span>
        <span class="obs-run-meta">${created} · ${r.total_tokens ?? 0} tok</span>
      </div>`;
    }).join('');
  } catch (err) {
    listEl.innerHTML = `<div class="memory-empty">加载失败：${esc(err.message)}</div>`;
  }
}

async function loadRunEvents(runId) {
  const card = document.getElementById('obs-detail-card');
  const listEl = document.getElementById('obs-event-list');
  card.style.display = 'block';
  document.getElementById('obs-detail-title').textContent =
    `事件时间线 · ${String(runId).slice(0, 8)}`;
  listEl.innerHTML = '<div class="memory-empty">加载中…</div>';
  try {
    const data = await apiFetch(`/api/runs/${encodeURIComponent(runId)}/events?limit=500`);
    const events = data.events || [];
    if (!events.length) {
      listEl.innerHTML = '<div class="memory-empty">该运行暂无事件</div>';
      return;
    }
    listEl.innerHTML = events.map(renderEvent).join('');
  } catch (err) {
    listEl.innerHTML = `<div class="memory-empty">加载失败：${esc(err.message)}</div>`;
  }
}

function renderEvent(e) {
  const [icon, label] = OBS_EVENT_META[e.event_type] || ['📄', esc(e.event_type || '事件')];
  const meta = e.metadata || {};
  let detail = '';
  if (e.event_type === 'route') {
    detail = `→ ${esc(meta.target || '?')}${meta.retry ? '（重试）' : ''} · ${esc(String(meta.task || '').slice(0, 60))}`;
  } else if (e.event_type === 'token') {
    detail = `${esc(meta.node || '')} · in ${meta.input_tokens ?? 0} / out ${meta.output_tokens ?? 0} / total ${meta.total_tokens ?? 0}`;
  } else if (e.event_type === 'reflect') {
    detail = `${meta.passed ? '通过' : '未通过'} · ${esc(String(meta.feedback || '').slice(0, 80))} · 第 ${meta.round ?? 0} 轮`;
  } else if (e.event_type === 'subagent_start') {
    detail = `${esc(meta.target || '')} · timeout ${meta.timeout_seconds ?? '-'}s`;
  } else if (e.event_type === 'subagent_end') {
    detail = `${esc(meta.target || '')} · ${esc(meta.status || '')}${meta.error ? ' · ' + esc(String(meta.error).slice(0, 60)) : ''}`;
  } else if (e.event_type === 'run_end') {
    detail = `${esc(meta.status || '')} · total ${meta.total_tokens ?? 0} tok`;
  } else {
    detail = esc(String(e.content || '').slice(0, 60));
  }
  const time = String(e.created_at || '').replace('T', ' ').slice(5, 19);
  return `<div class="obs-event">
    <span class="obs-event-icon">${icon}</span>
    <span class="obs-event-label">${label}</span>
    <span class="obs-event-detail">${detail || '-'}</span>
    <span class="obs-event-time">${time}</span>
  </div>`;
}

document.getElementById('obs-refresh').addEventListener('click', loadRuns);
document.getElementById('obs-detail-close').addEventListener('click', () => {
  document.getElementById('obs-detail-card').style.display = 'none';
});
document.getElementById('obs-run-list').addEventListener('click', (e) => {
  const item = e.target.closest('.obs-run-item');
  if (item) loadRunEvents(item.dataset.runId);
});

inputEl.focus();
console.log('my-df 对话界面已加载');
